name: Notify WordPress

# Sends a JSON payload to a custom WordPress REST API endpoint whenever code is
# pushed or a release is published.
#
# Required repository secret:
#   WP_WEBHOOK_URL    Full endpoint URL, e.g.
#                     https://example.org/wp-json/dqc/v1/github-event
#
# Optional repository secrets:
#   WP_USERNAME       WordPress user for Basic auth (used with WP_APP_PASSWORD)
#   WP_APP_PASSWORD   WordPress Application Password for that user
#   WP_WEBHOOK_SECRET Shared secret; when set, the request carries an
#                     X-Hub-Signature-256 header (HMAC-SHA256 of the raw body)
#                     that the endpoint can verify.

on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-notify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build JSON payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Event-specific data is passed as JSON through env vars (never
          # interpolated into the script) to avoid shell injection.
          PUSH_JSON: ${{ github.event_name == 'push' && toJSON(github.event) || '{}' }}
          RELEASE_JSON: ${{ github.event_name == 'release' && toJSON(github.event.release) || '{}' }}
        run: |
          set -euo pipefail

          jq -n \
            --arg event "$EVENT_NAME" \
            --arg repository "$REPOSITORY" \
            --arg repository_url "$REPOSITORY_URL" \
            --arg ref "$REF" \
            --arg ref_name "$REF_NAME" \
            --arg sha "$SHA" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson push "$PUSH_JSON" \
            --argjson release "$RELEASE_JSON" \
            '{
              event: $event,
              repository: $repository,
              repository_url: $repository_url,
              ref: $ref,
              ref_name: $ref_name,
              sha: $sha,
              actor: $actor,
              run_url: $run_url,
              timestamp: $timestamp
            }
            + (if $event == "push" then {
                push: {
                  before: $push.before,
                  after: $push.after,
                  compare_url: $push.compare,
                  forced: ($push.forced // false),
                  created: ($push.created // false),
                  deleted: ($push.deleted // false),
                  pusher: $push.pusher.name,
                  head_commit: (if $push.head_commit then {
                    id: $push.head_commit.id,
                    message: $push.head_commit.message,
                    url: $push.head_commit.url,
                    timestamp: $push.head_commit.timestamp,
                    author: $push.head_commit.author.name
                  } else null end),
                  commits: [ ($push.commits // [])[] | {
                    id, message, url, timestamp,
                    author: .author.name,
                    added, removed, modified
                  } ]
                }
              } else {} end)
            + (if $event == "release" then {
                release: {
                  id: $release.id,
                  tag_name: $release.tag_name,
                  name: $release.name,
                  body: $release.body,
                  draft: $release.draft,
                  prerelease: $release.prerelease,
                  published_at: $release.published_at,
                  html_url: $release.html_url,
                  author: $release.author.login,
                  assets: [ ($release.assets // [])[] | {
                    name, size, content_type,
                    download_url: .browser_download_url
                  } ]
                }
              } else {} end)' > payload.json

          echo "Payload:"
          cat payload.json

      - name: Send payload to WordPress
        env:
          WP_WEBHOOK_URL: ${{ secrets.WP_WEBHOOK_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_WEBHOOK_SECRET: ${{ secrets.WP_WEBHOOK_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [ -z "${WP_WEBHOOK_URL:-}" ]; then
            echo "::notice::WP_WEBHOOK_URL secret is not set; skipping WordPress notification."
            exit 0
          fi

          headers=(
            -H "Content-Type: application/json"
            -H "User-Agent: github-actions-wordpress-notify"
            -H "X-GitHub-Event: ${EVENT_NAME}"
            -H "X-GitHub-Delivery: ${DELIVERY_ID}"
          )

          if [ -n "${WP_WEBHOOK_SECRET:-}" ]; then
            signature=$(openssl dgst -sha256 -hmac "$WP_WEBHOOK_SECRET" -hex < payload.json | sed 's/^.*= //')
            headers+=(-H "X-Hub-Signature-256: sha256=${signature}")
          fi

          auth=()
          if [ -n "${WP_USERNAME:-}" ] && [ -n "${WP_APP_PASSWORD:-}" ]; then
            auth=(--user "${WP_USERNAME}:${WP_APP_PASSWORD}")
          fi

          http_code=$(curl --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 30 \
            --output response.txt --write-out '%{http_code}' \
            -X POST "${headers[@]}" "${auth[@]}" \
            --data-binary @payload.json \
            "$WP_WEBHOOK_URL")

          echo "HTTP status: ${http_code}"
          echo "Response body:"
          cat response.txt; echo

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::WordPress endpoint returned HTTP ${http_code}"
            exit 1
          fi
